name: Apron PR announce
description: Announce merged pull requests in an Apron chat room as a bot, with a link preview.
author: Apron Chat
branding:
  icon: message-circle
  color: green

inputs:
  token:
    description: >
      Bot token from /invite-bot. When empty the action logs a notice and
      succeeds without posting, so forks and repositories without the secret
      skip it.
    required: false
    default: ''
  room-id:
    description: The room to post in.
    required: false
    default: general
  template:
    description: >
      The markdown text of the announcement, with ${name} placeholders such as
      ${title}, ${author}, and ${url}; see the README for the full list. The
      link preview below it does not depend on the template.
    required: false
    default: |-
      🚢 ${repo}#${number}: **${title}** by ${author} (+${additions} −${deletions})
      ${url}
  server-url:
    description: >
      The Apron server's WebSocket URL, such as wss://chat.example.com/. There
      is no default, so no project posts to a server it did not choose.
    required: true

runs:
  using: node24
  main: announce-pr.mjs
